name: Update tracker data

on:
  schedule:
    - cron: "0 */6 * * *"      # ทุก 6 ชั่วโมง
  workflow_dispatch:            # กดรันเองได้จากหน้า Actions
  push:
    branches: [main]
    paths:
      - "update.py"
      - "index.html"
      - "assets/**"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch data and rebuild
        run: python3 update.py --sims 40000

      - name: Commit if changed
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data/stats.json standalone.html
          if git diff --staged --quiet; then
            echo "ไม่มีข้อมูลใหม่"
          else
            git commit -m "chore: update tracker data ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
            git push
          fi
