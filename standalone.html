<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoV Team Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#293040;
  --text:#e6edf3; --muted:#8b949e;
  --accent:#ff7a45; --good:#3fb950; --bad:#f85149; --warn:#d29922; --info:#58a6ff;
  --radius:12px;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"IBM Plex Sans Thai",system-ui,-apple-system,sans-serif;
  line-height:1.65;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
a{color:var(--info)}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.num{font-family:"JetBrains Mono","IBM Plex Sans Thai",ui-monospace,monospace}

/* header */
.topbar{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#151b26,#0d1117);padding:22px 0 18px}
.topbar .wrap{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:14px;align-items:center}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent);flex:0 0 auto}
.topbar h1{margin:0;font-size:1.5rem;letter-spacing:-.01em}
.topbar p{margin:2px 0 0;font-size:.85rem}
.headline{display:flex;gap:10px;flex-wrap:wrap}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.82rem}
.pill b{color:var(--accent)}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 20px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  background:transparent;border:1px solid transparent;color:var(--muted);
  font:inherit;font-size:.9rem;padding:8px 15px;border-radius:9px;cursor:pointer;white-space:nowrap;
}
.tabs button:hover{color:var(--text);background:#ffffff08}
.tabs button.active{background:var(--panel);border-color:var(--line);color:var(--text);font-weight:600}

/* layout */
main{padding:22px 20px 40px}
.loading{color:var(--muted);padding:40px 0;text-align:center}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.card.wide{grid-column:1/-1}
.card h2{margin:0 0 4px;font-size:1.02rem;display:flex;align-items:center;gap:8px}
.card .hint{margin:0 0 14px;font-size:.8rem;color:var(--muted)}
.verdict{border-left:3px solid var(--accent);padding:10px 14px;background:#ffffff06;border-radius:0 8px 8px 0;font-size:.88rem;margin-top:14px}
.verdict b{color:var(--accent)}

/* big stat */
.stat{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px}
.stat .v{font-size:2.3rem;font-weight:700;line-height:1;font-family:"JetBrains Mono","IBM Plex Sans Thai",monospace}
.stat .u{color:var(--muted);font-size:.85rem}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{font-size:.74rem;color:var(--muted);display:block;margin-bottom:4px}
.kpi .n{font-size:1.4rem;font-weight:700;font-family:"JetBrains Mono","IBM Plex Sans Thai",monospace}
.kpi .c{font-size:.72rem;color:var(--muted)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:.76rem;text-transform:uppercase;letter-spacing:.04em}
tbody tr:last-child td{border-bottom:none}
tbody tr.me{background:#ff7a4514}
tbody tr.me td{font-weight:600}
td.r,th.r{text-align:right;font-family:"JetBrains Mono","IBM Plex Sans Thai",monospace}
.zone{display:inline-block;width:3px;height:16px;border-radius:2px;vertical-align:-3px;margin-right:8px}
.zone.up{background:var(--good)}.zone.mid{background:var(--warn)}.zone.out{background:#39414f}

/* bars */
.bars{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.bar{display:grid;grid-template-columns:118px 1fr 74px;gap:10px;align-items:center;font-size:.83rem}
.bar .track{display:block;background:#ffffff0d;border-radius:5px;height:18px;position:relative;overflow:hidden}
.bar .fill{display:block;height:100%;min-width:2px;border-radius:5px;background:var(--accent);transition:width .5s ease}
.bar .fill.good{background:var(--good)}.bar .fill.bad{background:var(--bad)}.bar .fill.info{background:var(--info)}
.bar .ref{position:absolute;top:0;bottom:0;width:2px;background:#ffffff66}
.bar .val{text-align:right;font-family:"JetBrains Mono","IBM Plex Sans Thai",monospace;font-size:.82rem}
.bar .lbl{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{font-size:.74rem;color:var(--muted);margin-top:10px}

/* flow */
.flowlist{display:flex;flex-direction:column;gap:7px}
.flowrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;font-size:.84rem}
.flow{display:flex;gap:3px}
.g{width:19px;height:19px;border-radius:5px;display:grid;place-items:center;font-size:.68rem;font-weight:700;font-family:"JetBrains Mono","IBM Plex Sans Thai",monospace}
.g.w{background:#3fb95030;color:var(--good)}
.g.l{background:#f8514930;color:var(--bad)}
.tag{font-size:.7rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.w{color:var(--good);border-color:#3fb95055}
.tag.l{color:var(--bad);border-color:#f8514955}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:.8rem}
.chip b{font-family:"JetBrains Mono","IBM Plex Sans Thai",monospace}
.chip.good{border-color:#3fb95055}.chip.bad{border-color:#f8514955}

.pos{color:var(--good)}.neg{color:var(--bad)}
.sect-title{margin:26px 0 10px;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
footer{padding:22px 20px 40px;border-top:1px solid var(--line);margin-top:20px}
@media(max-width:560px){
  .stat .v{font-size:1.9rem}
  .bar{grid-template-columns:92px 1fr 64px;font-size:.78rem}
  .topbar h1{font-size:1.25rem}
}

</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <h1 id="teamName">กำลังโหลด…</h1>
        <p id="subtitle" class="muted"></p>
      </div>
    </div>
    <div class="headline" id="headline"></div>
  </div>
</header>

<nav class="tabs wrap" id="tabs">
  <button data-tab="overview" class="active">ภาพรวม</button>
  <button data-tab="diagnosis">วินิจฉัยปัญหา</button>
  <button data-tab="draft">ดราฟท์ &amp; ฮีโร่</button>

  <button data-tab="meta">เมต้าเปลี่ยน</button>

</nav>

<main class="wrap" id="app">

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const pct = v => (v === null || v === undefined) ? '–' : v + '%';
const signed = v => (v > 0 ? '+' : '') + v;
const cls = v => v > 0 ? 'pos' : (v < 0 ? 'neg' : '');

/* ---------- small builders ---------- */
function card(title, hint, body, wide) {
  return `<section class="card${wide ? ' wide' : ''}">
    <h2>${title}</h2>${hint ? `<p class="hint">${hint}</p>` : ''}${body}</section>`;
}
function kpi(label, value, comment) {
  return `<div class="kpi"><span class="l">${label}</span>
    <span class="n">${value}</span>${comment ? `<div class="c">${comment}</div>` : ''}</div>`;
}
/** bar: value 0-100, ref = เส้นอ้างอิง (ค่าเฉลี่ยลีก) */
function bar(label, value, right, opts = {}) {
  const v = Math.max(0, Math.min(100, value || 0));
  let tone = opts.tone;
  if (!tone && opts.ref != null) tone = value >= opts.ref ? 'good' : 'bad';
  return `<div class="bar">
    <span class="lbl" title="${esc(label)}">${esc(label)}</span>
    <span class="track"><span class="fill ${tone || ''}" style="width:${v}%"></span>
      ${opts.ref != null ? `<span class="ref" style="left:${Math.min(99, opts.ref)}%" title="ค่าเฉลี่ยลีก ${opts.ref}%"></span>` : ''}
    </span>
    <span class="val">${right}</span></div>`;
}
function table(headers, rows) {
  return `<table><thead><tr>${headers.map(h =>
    `<th class="${h.r ? 'r' : ''}">${h.t}</th>`).join('')}</tr></thead>
    <tbody>${rows.join('')}</tbody></table>`;
}

          <td class="r">${signed(f.swing)}</td></tr>`)))}
    </div>

    ${card('รายเกมของทีม', 'ค่าจังหวะคอมของเราเทียบของเขา และเกมนั้นยาวจริงเท่าไหร่', table(
      [{ t: 'คู่แข่ง' }, { t: 'คอมเรา', r: 1 }, { t: 'คอมเขา', r: 1 }, { t: 'แบบ' }, { t: 'นาที', r: 1 }, { t: 'ผล', r: 1 }],
      t.games.map(g => `<tr><td>${esc(g.opponent)}</td>
        <td class="r">${g.ours}</td><td class="r">${g.theirs}</td>
        <td class="small muted">${label[g.kind]}</td>
        <td class="r">${g.minutes ?? '–'}</td>
        <td class="r"><span class="tag ${g.won ? 'w' : 'l'}">${g.won ? 'ชนะ' : 'แพ้'}</span></td></tr>`)), true)}`;
  },

  /* ======================= เมต้า ======================= */
  meta() {
    if (!D.meta_shift) return card('ไม่มีข้อมูลเปรียบเทียบ', '', '<p class="muted small">ยังไม่มีข้อมูลสปลิตก่อนหน้าสำหรับเทียบเมต้า</p>', true);
    const m = D.meta_shift, a = m.adaptation;

    return `
    <div class="grid">
      ${card('ทีมตามเมต้าใหม่ทันไหม', `อัตราชนะบนฮีโร่ที่ presence พุ่งขึ้นจาก ${m.prev_label} มา ${m.cur_label}`, `
        <div class="bars">
          ${bar('ทีมของเรา', a.team_wr, `${a.team_wr}% (${a.team_n} ครั้ง)`, { ref: a.league_wr })}
          ${bar('ทีมอื่นทั้งลีก', a.league_wr, `${a.league_wr}% (${a.league_n} ครั้ง)`, { tone: 'info' })}
        </div>
        <div class="verdict">ช่องว่างตรงนี้คือ <b>ความเร็วในการปรับตัวเข้าแพตช์</b> ซึ่งเป็นเรื่องกระบวนการซ้อม
          ไม่ใช่ฝีมือ — ถ้าต่ำกว่าลีกเกิน 5 จุด แปลว่าต้องรื้อวิธีเตรียมพูลฮีโร่</div>`, true)}
    </div>

    <div class="grid">
      ${card('ตัวที่มาแรงในสปลิตนี้', 'presence = สัดส่วนเกมที่ถูกพิกหรือแบน', table(
        [{ t: 'ฮีโร่' }, { t: m.prev_label, r: 1 }, { t: m.cur_label, r: 1 }, { t: 'ทีมใช้', r: 1 }],
        m.risers.map(r => `<tr><td>${cap(r.hero)}</td>
          <td class="r muted">${r.prev}%</td><td class="r pos">${r.cur}%</td>
          <td class="r ${r.team_cur === 0 ? 'neg' : ''}">${r.team_cur} เกม</td></tr>`)))}

      ${card('ตัวที่ร่วงจากเมต้า', '', table(
        [{ t: 'ฮีโร่' }, { t: m.prev_label, r: 1 }, { t: m.cur_label, r: 1 }],
        m.fallers.map(r => `<tr><td>${cap(r.hero)}</td>
          <td class="r">${r.prev}%</td><td class="r neg">${r.cur}%</td></tr>`)))}

      ${card('ของถนัดเดิมที่หายไป', `ตัวที่ทีมใช้บ่อยใน ${m.prev_label} แต่แทบไม่ได้ใช้แล้ว`, table(
        [{ t: 'ฮีโร่' }, { t: m.prev_label, r: 1 }, { t: m.cur_label, r: 1 }],
        m.lost_tools.map(r => `<tr><td>${cap(r.hero)}</td>
          <td class="r">${r.prev} เกม</td><td class="r neg">${r.cur} เกม</td></tr>`)))}
    </div>`;
  },

  /* ======================= คู่ต่อไป ======================= */
  prep() {
    if (!D.prep.length) return card('จบฤดูกาลแล้ว', '', '<p class="muted small">ไม่มีแมตช์เหลือ</p>', true);
    return D.prep.map(p => card(
      `${esc(p.opponent)} <span class="muted small" style="font-weight:400">${esc(p.date.replace(' - ', ' • '))}</span>`,
      p.head_to_head.length
        ? 'เจอกันมาแล้ว: ' + p.head_to_head.map(h =>
            `${h.date} ${h.won ? 'ชนะ' : 'แพ้'} ${h.score}`).join(' | ')
        : 'ยังไม่เคยเจอกันในสปลิตนี้',
      `<p class="small muted" style="margin:0 0 8px">ตัวที่เขาเล่นแล้วแรงที่สุด (ตั้งแต่ 4 เกมขึ้นไป) — ใช้เป็นลิสต์ตั้งต้นในการแบน แล้วค่อยกรองด้วยว่าตัวไหนตีคอมที่เราจะเล่น</p>
       <div class="chips">${p.threats.map(t =>
         `<span class="chip ${t.wr >= 70 ? 'bad' : ''}">${cap(t.hero)} <b>${t.wr}%</b>
          <span class="muted small">${t.n} เกม</span></span>`).join('')}</div>`, true)).join('');
  },
};

/* ---------- boot ---------- */
function render() {
  el.innerHTML = TABS[currentTab]();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('button[data-tab]');
  if (!btn) return;
  currentTab = btn.dataset.tab;
  [...document.querySelectorAll('#tabs button')].forEach(b =>
    b.classList.toggle('active', b === btn));
  render();
});

/** ถ้าเป็นไฟล์ standalone ข้อมูลจะถูกฝังมาใน window.__STATS__ แล้ว ไม่ต้อง fetch */
const source = window.__STATS__
  ? Promise.resolve(window.__STATS__)
  : fetch('data/stats.json', { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error('โหลด data/stats.json ไม่ได้ (' + r.status + ')'); return r.json(); });

source
  .then(data => {
    D = data;
    const me = D.standings.find(r => r.team === D.meta.team);
    document.title = `${D.meta.team} Tracker — ${D.meta.tournament}`;
    document.getElementById('teamName').textContent = D.meta.team;
    document.getElementById('subtitle').textContent =
      `RoV Pro League ${D.meta.tournament} • แข่งไปแล้ว ${D.meta.played}/${D.meta.total} แมตช์ของลีก`;
    document.getElementById('headline').innerHTML = `
      <span class="pill">อันดับ <b>#${me.rank}</b></span>
      <span class="pill">สถิติ <b>${me.w}–${me.l}</b></span>
      <span class="pill">Diff <b>${signed(me.diff)}</b></span>
      <span class="pill">เข้ารอบ <b>${D.odds.top4}%</b></span>`;
    document.getElementById('srcLink').href = D.meta.source_url;
    document.getElementById('updatedAt').textContent =
      'อัปเดตข้อมูลล่าสุด: ' + new Date(D.meta.updated_at).toLocaleString('th-TH');
    render();
  })
  .catch(err => {
    el.innerHTML = `<div class="card"><h2>โหลดข้อมูลไม่สำเร็จ</h2>
      <p class="hint">${esc(err.message)}</p>
      <p class="small">ให้รัน <code>python3 update.py</code> เพื่อสร้างไฟล์ data/stats.json ก่อน
      แล้วเปิดเว็บผ่าน <code>python3 -m http.server 8000</code> (เปิดไฟล์ตรง ๆ ด้วย file:// จะติด CORS)</p></div>`;
  });

</script>
</body>
